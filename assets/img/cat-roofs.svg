<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400" role="img" aria-label="Cat on moonlit roofs">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3340"/>
      <stop offset="55%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="72%" cy="22%" r="38%">
      <stop offset="0%" stop-color="#f0e6c8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c8b890" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="400" fill="url(#sky)"/>
  <rect width="320" height="400" fill="url(#moonGlow)"/>
  <circle cx="232" cy="78" r="26" fill="#e8dcc0"/>
  <circle cx="242" cy="72" r="22" fill="#2a3340"/>

  <!-- distant roofs -->
  <path d="M0 250 L70 198 L140 250 V400 H0 Z" fill="#3a424c"/>
  <path d="M90 268 L170 200 L250 268 V400 H90 Z" fill="#2f363f"/>
  <path d="M200 255 L270 205 L320 248 V400 H200 Z" fill="#454e59"/>

  <!-- roof ridges -->
  <path d="M0 250 L70 198 L140 250" fill="none" stroke="#8a93a0" stroke-width="2.5"/>
  <path d="M90 268 L170 200 L250 268" fill="none" stroke="#9aa3b0" stroke-width="2.5"/>
  <path d="M200 255 L270 205 L320 248" fill="none" stroke="#a8b0bb" stroke-width="2.5"/>

  <!-- windows -->
  <rect x="34" y="278" width="12" height="14" rx="1" fill="#d4b56a"/>
  <rect x="58" y="290" width="10" height="12" rx="1" fill="#c4a45a" opacity="0.85"/>
  <rect x="128" y="255" width="13" height="15" rx="1" fill="#e0c878"/>
  <rect x="158" y="268" width="11" height="13" rx="1" fill="#c9ae62" opacity="0.9"/>
  <rect x="186" y="260" width="12" height="14" rx="1" fill="#d8b86e"/>
  <rect x="248" y="252" width="12" height="14" rx="1" fill="#e2c87a"/>
  <rect x="276" y="268" width="10" height="12" rx="1" fill="#c4a45a" opacity="0.8"/>

  <!-- chimney -->
  <rect x="152" y="214" width="10" height="22" fill="#5a6370"/>
  <rect x="149" y="210" width="16" height="6" fill="#6d7684"/>

  <!-- cat on center ridge: body + head + ears + tail -->
  <g transform="translate(168 188)">
    <ellipse cx="0" cy="10" rx="14" ry="9" fill="#1a1a1a"/>
    <circle cx="10" cy="2" r="7.5" fill="#1a1a1a"/>
    <path d="M5 -4 L7 -14 L12 -3 Z" fill="#1a1a1a"/>
    <path d="M12 -3 L18 -13 L17 -2 Z" fill="#1a1a1a"/>
    <circle cx="12.5" cy="1" r="1.2" fill="#d4b56a"/>
    <circle cx="16.5" cy="1" r="1.2" fill="#d4b56a"/>
    <path d="M-12 12 Q-28 0 -22 -10" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- faint thread / wind marks -->
  <g fill="none" stroke="#c8b890" stroke-width="1" opacity="0.35">
    <path d="M28 56 l30 -8"/>
    <path d="M34 68 l24 -6"/>
    <path d="M260 330 l28 10"/>
  </g>
</svg>
