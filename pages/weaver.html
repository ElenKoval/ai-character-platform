<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Weaver - SunnyChimera</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/weaver.css" />
    <link rel="stylesheet" href="../assets/css/character.css" />
</head>
<body class="world world--weaver character-page character-page--horizontal" data-mobile-tabs>
<header class="topbar">
    <div class="topbar__left">
        <a class="topbar__link" href="../index.html" data-i18n="common.gate">The Gate</a>
        <a class="topbar__link" href="dream-world.html" data-i18n="common.dreamWorld">Dream's World</a>
        <a class="topbar__link" href="weaver-world.html" data-i18n="common.weaverWorld">Weaver's World</a>
    </div>
    <div class="topbar__right"></div>
</header>

<main class="character-layout character-layout--with-lore">
    <aside class="character-lore">
        <h2 class="character-lore__title" data-i18n="lore.tracesTitle">Stories</h2>
        <div class="character-lore__stories" data-character-lore-nav>
            <button type="button" class="character-lore__story-btn is-active" data-story-src="../content/weaver-lore-cat.html" data-i18n-story="lore.weaverCat">Weaver and Cat</button>
            <button type="button" class="character-lore__story-btn" data-story-src="../content/weaver-lore-flight.html" data-i18n-story="lore.weaverFlight">The Flight</button>
        </div>
        <div class="character-lore__text" data-character-lore-content aria-busy="true">
            <!-- Lore loaded from content/weaver-lore-cat.html -->
        </div>
    </aside>
    <figure class="character-figure">
        <div class="character-figure__img-wrap">
            <img src="../assets/img/weaver.jpeg" alt="Weaver" />
        </div>
        <figcaption class="character-caption">
            <div class="character-caption__row">
                <div class="character-caption__left">
                    <h1 class="character-caption__name">Weaver</h1>
                    <div class="character-caption__actions">
                        <a href="dream-world.html" data-i18n="common.dreamWorld">Dream's World</a>
                        <a href="weaver-world.html" data-i18n="common.weaverWorld">Weaver's World</a>
                        <a href="../index.html" data-i18n="characterNav.gate">The Gate</a>
                    </div>
                </div>
                <a class="sound-playlist-link" href="sound.html#sound-weaver" data-i18n="chat.innerSound">Inner Sound</a>
            </div>
        </figcaption>
        <aside class="character-chat">
            <div class="chat" data-character="weaver">
                <header class="chat__header">
                    <span class="chat__header-title"></span>
                    <div class="chat__source-switcher">
                        <button type="button" class="chat__source-btn chat__source-btn--roots is-active" title="Groq" aria-label="Roots (Groq)">
                            <svg class="chat__source-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 4c0 2 2 4 4 6 2-2 4-4 4-6M8 20c0-2 2-4 4-6 2 2 4 4 4 6M4 8c2 0 4 2 6 4-2 2-4 4-6 4M20 8c-2 0-4 2-6 4 2 2 4 4 6 4M6 6l2 2 2-2M14 14l2 2 2-2M6 18l2-2 2 2M14 10l2-2 2 2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                        </button>
                        <span class="chat__source-divider" aria-hidden="true"></span>
                        <button type="button" class="chat__source-btn chat__source-btn--aether" title="Gemini" aria-label="Aether (Gemini)">
                            <svg class="chat__source-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M12 9l.8 2.4 2.4.8-2.4.8L12 15l-.8-2.4L8.8 12l2.4-.8L12 9z" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                        </button>
                    </div>
                    <button type="button" class="chat__eye-toggle" aria-label="????????? ??? ????????? ???" title="?????????? / ???????? ???">
                        <svg class="chat__eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path class="chat__eye-lid" d="M12 3 L21 12 L12 21 L3 12 Z" fill="none" stroke="currentColor" stroke-width="1"/>
                            <circle class="chat__eye-pupil" cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1"/>
                        </svg>
                    </button>
                </header>
                <div class="chat__provider" aria-label="Choose model">
                    <span class="chat__provider-label">Model</span>
                    <button type="button" class="chat__provider-btn" data-provider="gemini">Gemini</button>
                    <button type="button" class="chat__provider-btn is-active" data-provider="groq">Groq</button>
                </div>
                <div class="chat__log">
                    <div class="chat__msg chat__msg--npc">
                        <div class="chat__bubble" data-i18n="weaver.greeting">I'm Weaver. Name what you want so badly that you're afraid to hear your own answer.</div>
                    </div>
                </div>
                <form class="chat__form">
                    <input class="chat__input" type="text" placeholder="Seek the truth..." autocomplete="off">
                    <button class="chat__send" type="submit">Send</button>
                </form>
                <p class="chat__hint">Type to Weaver and press Send. Response via Gemini or Ollama.</p>
            </div>
        </aside>
    </figure>
</main>
<script src="../assets/js/atmosphere.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/character-lore-switch.js"></script>
<script src="../assets/js/character-mobile-tabs.js"></script>
<script src="../assets/js/character-chat.js"></script>
</body>
</html>
