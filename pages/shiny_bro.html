<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Брат Шайни - SunnyChimera</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alice&family=Bad+Script&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
    <link rel="stylesheet" href="../assets/css/site-shell.css" />
    <link rel="stylesheet" href="../assets/css/character.css" />
</head>
<body class="world world--weaver character-page character-page--dossier">
<main class="dossier" data-dossier="shinyBro">
  <div class="dossier__art">
    <div class="notebook-page notebook-page--placeholder">
      <div class="notebook-page__spiral" aria-hidden="true"></div>
      <p class="art-placeholder" data-art-placeholder data-i18n="shinyBro.artPlaceholder">Брат вышел за бурбоном. Скоро вернётся.</p>
    </div>
  </div>
  <div class="dossier__name-block">
    <h1 class="dossier__name">Брат Шайни</h1>
    <p class="dossier__essence">Брат Шайни — жёсткая защита</p>
    <p class="dossier__blurb">Стоит рядом со светом сестры и готов разбить всё, что подходит слишком близко.</p>
    <p class="dossier__quote">«К ней — только через меня».</p>
  </div>
  <div class="dossier__meta">
    <section>
      <h2>Звук мира</h2>
      <div data-dossier-tracks></div>
    </section>
  </div>
  <div class="dossier__chat">
    <aside class="character-chat is-expanded">
      <div class="chat" data-character="shiny_bro">
        <header class="chat__header">
          <span class="chat__header-title"></span>
        </header>
        <div class="chat__log">
          <div class="chat__msg chat__msg--npc">
            <div class="chat__bubble" data-i18n="shiny_bro.greeting">Through me.</div>
          </div>
        </div>
        <form class="chat__form">
          <input class="chat__input" type="text" placeholder="Спроси…" autocomplete="off">
          <button class="chat__send" type="submit">Отправить</button>
        </form>
        <p class="chat__hint" aria-live="polite"></p>
      </div>
    </aside>
  </div>
</main>
<script src="../assets/js/atmosphere.js"></script>
<script src="../assets/js/homepage-story.js"></script>
<script src="../assets/js/locale.js"></script>
  <script src="../assets/js/story-meta.js"></script>
<script src="../assets/js/talk-nav.js"></script>
<script src="../assets/js/site-shell.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/character-page.js"></script>
<script src="../assets/js/character-chat.js"></script>
</body>
</html>
