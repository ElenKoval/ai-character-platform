<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dream's World - SunnyChimera</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/world.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alice&family=Bad+Script&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
    <link rel="stylesheet" href="../assets/css/site-shell.css" />
</head>
<body class="world-page world--dream world-page--ink">
<main class="world-page__container">
    <header class="world-care-heading">
        <h2 class="world-team__title" data-i18n="dreamWorld.title">Dream's World</h2>
        <p class="world-care-heading__tag" data-i18n="dreamWorld.heroTag">order · growth</p>
    </header>

    <div class="world-stage world-stage--care">
        <svg class="world-threads" data-thread-mode="calm" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true"></svg>

        <article class="care-cat world-team__card">
            <a href="cat.html" class="world-team__card-img-link" aria-label="Cat">
                <img src="../assets/img/cat.jpeg" alt="Cat" />
                <div class="world-team__card-info">
                    <div class="world-team__card-name" data-i18n="names.cat">Cat</div>
                    <p class="world-quote">«Страшно даже признать, насколько тебе кто-то дорог».</p>
                </div>
            </a>
        </article>

        <div class="care-thread" aria-hidden="true">
            <svg class="care-thread__svg" viewBox="0 0 60 900" preserveAspectRatio="none">
                <path class="care-thread__glow" d="M30 20 C26 140 34 260 28 380 S36 560 30 700 S24 820 30 880"/>
                <path class="care-thread__core" d="M30 20 C26 140 34 260 28 380 S36 560 30 700 S24 820 30 880"/>
                <path class="care-thread__flow" pathLength="1000" d="M30 20 C26 140 34 260 28 380 S36 560 30 700 S24 820 30 880"/>
            </svg>
        </div>

        <section class="care-dream">
            <a class="world-hero__frame" href="dream.html">
                <img src="../assets/img/dream2.jpeg" alt="Dream" />
                <h1 class="world-hero__name" data-i18n="names.dream">Dream</h1>
                <p class="world-quote">«Я здесь. Я тебя держу».</p>
            </a>
        </section>

        <article class="care-guard care-guard--pak world-team__card">
            <a href="drpak.html" class="world-team__card-img-link">
                <img src="../assets/img/dr.pak.jpeg" alt="Pak" />
                <div class="world-team__card-info">
                    <div class="world-team__card-name" data-i18n="names.pak">Pak</div>
                    <p class="world-quote">«Вы хотите не свободы. Вы хотите пожара».</p>
                </div>
            </a>
        </article>

        <article class="care-guard care-guard--liora world-team__card">
            <a href="liora.html" class="world-team__card-img-link">
                <img src="../assets/img/liora_dead.jpeg" alt="Liora" />
                <div class="world-team__card-info">
                    <div class="world-team__card-name" data-i18n="names.liora">Liora</div>
                    <p class="world-quote">«Я тебя слышу».</p>
                </div>
            </a>
        </article>

        <article class="care-guard care-guard--crystal world-team__card">
            <a href="crystal.html" class="world-team__card-img-link">
                <img src="../assets/img/Crystal.jpeg" alt="Crystal" />
                <div class="world-team__card-info">
                    <div class="world-team__card-name" data-i18n="names.crystal">Crystal</div>
                    <p class="world-quote">«Вы так стараетесь убежать друг от друга, что забыли, как звучите вместе».</p>
                </div>
            </a>
        </article>
    </div>
</main>
<script src="../assets/js/homepage-story.js"></script>
<script src="../assets/js/locale.js"></script>
  <script src="../assets/js/story-meta.js"></script>
<script src="../assets/js/site-shell.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/world-threads.js" defer></script>
<script src="../assets/js/world-scroll-hint.js"></script>
</body>
</html>
