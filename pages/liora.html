<main class="character-layout character-layout--with-lore character-layout--visual-left">

                <header class="chat__header">

<button type="button" class="chat__eye-toggle" aria-label="????????? ??? ????????? ???" title="?????????? / ???????? ???">

                            <circle class="chat__eye-pupil" cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1"/>

                <button type="button" class="chat__reset" aria-label="???????? ???" title="???????? ???">-</button>
<div class="chat__log">

            <p class="chat__hint" aria-live="polite"></p>
