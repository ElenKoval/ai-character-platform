<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Злой Лес - SunnyChimera</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../assets/css/site-shell.css" />
    <link rel="stylesheet" href="../assets/css/character.css" />
</head>
<body class="world world--weaver character-page character-page--dossier">
<main class="dossier" data-dossier="forest">
  <div class="dossier__art">
    <div class="notebook-page">
      <div class="notebook-page__spiral" aria-hidden="true"></div>
      <img class="notebook-page__img" src="../assets/img/angry_forest.jpeg" alt="Злой Лес" />
    </div>
  </div>
  <div class="dossier__name-block">
    <h1 class="dossier__name">Злой Лес</h1>
    <p class="dossier__essence">Злой Лес — боль, которой некуда деться</p>
    <p class="dossier__blurb">В него стекает вырезанная Жажда. Он помнит каждую Тень и каждую несправедливость Сада.</p>
    <p class="dossier__quote">«Спроси их, куда они девают твою боль».</p>
  </div>
  <div class="dossier__meta">
    <section>
      <h2>Появляется в главах</h2>
      <div data-dossier-chapters></div>
    </section>
    <section>
      <h2>Звук мира</h2>
      <div data-dossier-tracks></div>
    </section>
  </div>
  <div class="dossier__chat">
    <aside class="character-chat is-expanded">
      <div class="chat" data-character="angry_forest">
        <header class="chat__header">
          <span class="chat__header-title"></span>
        </header>
        <div class="chat__log">
          <div class="chat__msg chat__msg--npc">
            <div class="chat__bubble" data-i18n="angry_forest.greeting">Ask them where they put your pain.</div>
          </div>
        </div>
        <form class="chat__form">
          <input class="chat__input" type="text" placeholder="Спроси…" autocomplete="off">
          <button class="chat__send" type="submit">Отправить</button>
        </form>
        <p class="chat__hint" aria-live="polite"></p>
      </div>
    </aside>
  </div>
</main>
<script src="../assets/js/atmosphere.js"></script>
<script src="../assets/js/homepage-story.js"></script>
<script src="../assets/js/story-meta.js"></script>
<script src="../assets/js/talk-nav.js"></script>
<script src="../assets/js/site-shell.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/character-page.js"></script>
<script src="../assets/js/character-chat.js"></script>
</body>
</html>
