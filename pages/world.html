<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>The Root of All Things. Silence and Madness. - SunnyChimera</title>

    <link rel="preload" as="image" href="../assets/img/dryad.jpeg" fetchpriority="high" />
    <link rel="preload" as="image" href="../assets/img/keeper.jpeg" fetchpriority="high" />

    <link rel="stylesheet" href="../assets/css/base.css" />

    <link rel="stylesheet" href="../assets/css/weaver.css" />

    <link rel="stylesheet" href="../assets/css/character.css" />

    <link rel="stylesheet" href="../assets/css/world-history.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../assets/css/site-shell.css" />
</head>

<body class="world page-world-history">

<div class="world-history__chrome">
    <nav class="world-history__tabs" role="tablist" aria-label="World history sections">
        <button type="button" class="world-history__tab is-active" role="tab" id="world-tab-history" aria-selected="true" aria-controls="world-panel-history" data-world-tab="history" data-i18n="world.tabHistory">History</button>
        <button type="button" class="world-history__tab" role="tab" id="world-tab-duo" aria-selected="false" aria-controls="world-history-main" data-world-tab="duo" data-i18n="world.tabDuo">Dryad &amp; Kiper</button>
    </nav>
</div>

<main class="world-history world-history--tabs" id="world-history-main" data-world-view="history">

    <aside class="world-history__side world-history__side--left">
        <div class="world-history__frame">
            <div class="world-history__frame-media">
                <img src="../assets/img/dryad.jpeg" alt="Dryad" data-i18n="names.dryad" data-i18n-attr="alt" />
            </div>
            <div class="world-history__frame-footer">
                <p class="world-history__caption" data-i18n="world.dryadPlaceholder">Dryad</p>
                <p class="world-history__dryad-hint" data-i18n="world.dryadGreeting">The Dryad is silent. Speak — Kiper will answer.</p>
            </div>
        </div>
    </aside>



    <section class="world-history__panel world-history__panel--history is-active" id="world-panel-history" role="tabpanel" aria-labelledby="world-tab-history">

        <article class="world-history__center">

            <h1 class="world-history__title world-history__reveal" data-i18n-html="world.title">THE ROOT OF ALL THINGS<br>Silence and Madness</h1>

            <div class="world-history__text" data-world-story aria-busy="true">

                <div class="world-history__break-line" aria-hidden="true"></div>

                <div class="world-history__links world-history__reveal world-history__links--mobile">

                    <a class="world-history__btn world-history__btn--dream" href="album.html#dream" data-i18n="world.dreamWorldBtn">Dream's World</a>

                    <a class="world-history__btn world-history__btn--weaver" href="album.html#weaver" data-i18n="world.weaverWorldBtn">Weaver's World</a>

                </div>

            </div>

        </article>

    </section>



    <aside class="world-history__side world-history__side--right">

        <div class="world-history__frame">
            <div class="world-history__frame-media">
                <img src="../assets/img/keeper.jpeg" alt="Kiper" data-i18n="names.keeper" data-i18n-attr="alt" />
            </div>
            <p class="world-history__caption" data-i18n="world.keeperCaption">Kiper</p>
        </div>

        <div class="world-history__chat world-history__chat--keeper character-chat">

            <div class="chat world-history__chat-box" data-character="keeper">

                <header class="chat__header">

                    <span class="chat__header-title"></span>
<button type="button" class="chat__eye-toggle" aria-label="Toggle chat height" data-i18n="world.keeperEyeTitle" data-i18n-attr="title" title="The Kiper is watching...">

                        <svg class="chat__eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

                            <path class="chat__eye-lid" d="M12 3 L21 12 L12 21 L3 12 Z" fill="none" stroke="currentColor" stroke-width="1"/>

                            <circle class="chat__eye-pupil" cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1"/>

                        </svg>

                    </button>

                </header>
<div class="chat__log">

                    <div class="chat__msg chat__msg--npc">

                        <div class="chat__bubble" data-i18n="world.keeperGreeting">Don't move. You're blocking my view of yesterday. Well? Why are you staring? Your thoughts have too much... echo. Say something already.</div>

                    </div>

                </div>

                <form class="chat__form">

                    <div class="chat__input-row">

                        <input class="chat__input" type="text" placeholder="Seek the truth..." autocomplete="off" data-i18n="chat.seekPlaceholder" data-i18n-attr="placeholder">

                    </div>

                    <button class="chat__send" type="submit" data-i18n="chat.send">Send</button>

                </form>

            </div>

        </div>

    </aside>

</main>

<script src="../assets/js/atmosphere.js"></script>
<script src="../assets/js/homepage-story.js"></script>
<script src="../assets/js/story-meta.js"></script>
<script src="../assets/js/talk-nav.js"></script>
<script src="../assets/js/site-shell.js"></script>
<script src="../assets/js/i18n.js"></script>

<script src="../assets/js/world-history-tabs.js"></script>
<script src="../assets/js/world-root-chat.js"></script>

<script src="../assets/js/world-history-reveal.js"></script>

</body>

</html>
